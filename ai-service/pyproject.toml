[project]
name = "bossanalyze-jev"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = ["fastapi==0.133.0", "starlette==1.3.1", "httpx==0.28.1", "pydantic==2.12.4", "uvicorn==0.38.0"]

[dependency-groups]
dev = ["pytest==9.0.3", "pytest-asyncio==1.3.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

spring:
  profiles:
    active: local
  application:
    name: spring-crawler
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/boss_data?useSSL=false&characterEncoding=UTF-8
    username: your_db_username
    password: your_db_password
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: your_redis_password
server:
  port: 8081

# 直接到达本服务的 AI 请求必须由主 API 校验登录令牌
security:
  downstream-auth:
    enabled: true
    verification-url: ${BOSSANALYZE_API_URL:http://127.0.0.1:8080}/api/auth/getUserPrivateInformation
    permission-check-url: ${BOSSANALYZE_API_URL:http://127.0.0.1:8080}/api/auth/hasPagePermission
    connect-timeout-ms: 1000
    read-timeout-ms: 2000
    public-paths:
      - /actuator
      - /error

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.david.hlp.crawler.boss.entity

webdriver:
  chrome:
    driver: /path/to/chromedriver
    headless: true
# Enable only after the isolated migration, readers and quality gate are accepted.
crawler:
  ai:
    service-url: ${AI_SERVICE_URL:http://127.0.0.1:8090}
    scheduling:
      enabled: false
    writeback-enabled: false

# Enable AI scheduling after configuring Ollama and populating recruitment data.
server:
  address: 127.0.0.1
spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/boss_data?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: ${BOSSANALYZE_MYSQL_USERNAME:root}
    password: ${BOSSANALYZE_MYSQL_PASSWORD:}
  data:
    redis:
      host: 127.0.0.1
      password: ${BOSSANALYZE_REDIS_PASSWORD:}
      timeout: 5s
crawler:
  ai:
    scheduling:
      enabled: false
webdriver:
  chrome:
    driver: ${BOSSANALYZE_CHROMEDRIVER:}

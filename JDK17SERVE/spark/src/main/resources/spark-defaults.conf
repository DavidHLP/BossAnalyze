# Spark 基础配置
spark.app.name             SparkApplication
spark.master               spark://hadoop-master1:7077,hadoop-master2:7077,hadoop-master3:7077
spark.submit.deployMode    client

# 开启spark的日期记录功能
spark.eventLog.enabled     true
# 设置spark日志记录的路径
spark.eventLog.dir         hdfs://mycluster/spark-logs/
# 设置spark日志是否启动压缩
spark.eventLog.compress    true

# 使用Zookeeper作为恢复模式来启用Master节点的高可用性
spark.deploy.recoveryMode  ZOOKEEPER

# 设置Zookeeper集群的URL，用逗号分隔多个Zookeeper节点
spark.deploy.zookeeper.url  zoo1:2181,zoo2:2181,zoo3:2181

# 指定Zookeeper存储Spark Master状态的路径
spark.deploy.zookeeper.dir  /spark

# 性能优化配置
spark.executor.memory      2g
spark.executor.cores       2
spark.executor.instances   6
spark.driver.memory        2g
spark.driver.cores         2
spark.driver.maxResultSize 1g

# 序列化配置
spark.serializer           org.apache.spark.serializer.KryoSerializer
spark.kryoserializer.buffer.max  64m

# 网络配置
spark.network.timeout      300s
spark.sql.adaptive.enabled true
spark.sql.adaptive.coalescePartitions.enabled true

# 动态资源分配
spark.dynamicAllocation.enabled true
spark.dynamicAllocation.minExecutors 1
spark.dynamicAllocation.maxExecutors 10
spark.dynamicAllocation.initialExecutors 3

# Shuffle 优化
spark.shuffle.service.enabled true
spark.shuffle.compress true
spark.shuffle.spill.compress true

# 历史服务器配置
spark.history.fs.logDirectory hdfs://mycluster/spark-logs/
spark.history.fs.cleaner.enabled true
spark.history.fs.cleaner.interval 1d
spark.history.fs.cleaner.maxAge 7d
